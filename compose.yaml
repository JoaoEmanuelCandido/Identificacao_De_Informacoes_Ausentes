services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500"
    volumes:
      - ollama-data:/root/.ollama

  frontend:
    container_name: aplication_ollama_frontend
    build:
      context: ./frontend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    image: node:20-alpine
    container_name: aplication_ollama_backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:latest
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - ollama

volumes:
  ollama-data:
  frontend_node_modules:
